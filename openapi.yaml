openapi: 3.1.0
info:
  title: Varg Gateway API
  version: 0.1.0
  description: Unified REST API for AI generation (video, image, speech, music) at api.varg.ai

servers:
  - url: https://api.varg.ai/v1

security:
  - bearerAuth: []

tags:
  - name: Generation
    description: Create AI-generated content
  - name: Jobs
    description: Manage and monitor generation jobs
  - name: Files
    description: Upload files for use in generation
  - name: Reference
    description: Available models and voices
  - name: Media Processing
    description: FFmpeg-powered video utilities (trim, resize, probe, custom commands)
  - name: Account
    description: Account info, balance, and usage

paths:
  /video:
    post:
      operationId: createVideo
      tags: [Generation]
      summary: Generate video
      description: |
        Generate video from text, image, or video input. Returns a job that you poll or stream for completion.

        This endpoint also handles **lipsync** (provide audio + video/image via `files`), **video editing** (provide a video file), and **video upscaling** (provide a video file with an upscale model).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model:
                  type: string
                  description: |
                    Video model to use. Also accepts lipsync and video upscale models.

                    **Video generation:** `kling-v3`, `kling-v3-standard`, `seedance-2-preview`, `seedance-2-fast-preview`, `sora-2`, `sora-2-pro`, `wan-2.5`, `wan-2.5-preview`, `minimax`, `ltx-2-19b-distilled`, `grok-imagine`

                    **Video editing:** `grok-imagine-edit`, `sora-2-remix`, `seedance-2-preview`

                    **Motion control:** `kling-v2.6-motion`

                    **Lipsync:** `veed-fabric-1.0`, `sync-v2`, `sync-v2-pro`, `omnihuman-v1.5`

                    **Video upscale:** `seedvr-video`, `topaz-video`, `bytedance-upscaler`, `sima-video-upscaler`

                    **Legacy:** `kling-v2.6`, `kling-v2.5`, `kling-v2.1`, `kling-v2`
                  examples:
                    - kling-v3
                    - seedance-2-preview
                    - seedance-2-fast-preview
                    - sora-2
                    - wan-2.5
                    - minimax
                    - ltx-2-19b-distilled
                    - grok-imagine
                    - veed-fabric-1.0
                    - sync-v2
                    - seedvr-video
                prompt:
                  type: string
                  description: Text description of the video to generate. For lipsync and upscale models, can be empty.
                  example: ocean waves crashing on a rocky beach at sunset
                duration:
                  type: number
                  description: Duration in seconds. Seedance models only accept 5, 10, or 15. Kling V3 accepts integers 3-15.
                  default: 5
                  example: 5
                aspect_ratio:
                  type: string
                  description: Output aspect ratio
                  examples:
                    - "16:9"
                    - "9:16"
                    - "1:1"
                    - "4:3"
                    - "3:4"
                files:
                  type: array
                  description: |
                    Input files for image-to-video, video editing, lipsync, or upscale.

                    - **Image-to-video:** 1 image URL (first frame). Some models support 2 images for first+last keyframe.
                    - **Video editing:** 1 video URL (`.mp4`, `.webm`, `.mov`)
                    - **Lipsync:** 1 video/image URL + 1 audio URL
                    - **Video upscale:** 1 video URL
                  items:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
                        description: URL of the input file
                provider_options:
                  type: object
                  description: Additional options passed directly to the provider
                  additionalProperties: true
            examples:
              kling-v3-text-to-video:
                summary: "Kling V3 \u2014 text-to-video"
                value:
                  model: kling-v3
                  prompt: cinematic shot of ocean waves crashing on rocky cliffs at golden hour
                  duration: 5
                  aspect_ratio: "16:9"
              kling-v3-image-to-video:
                summary: "Kling V3 \u2014 image-to-video"
                value:
                  model: kling-v3
                  prompt: slow camera push-in, the subject blinks and smiles
                  duration: 5
                  files:
                    - url: https://example.com/portrait.jpg
              kling-v3-keyframe:
                summary: "Kling V3 \u2014 first + last frame keyframe"
                value:
                  model: kling-v3
                  prompt: smooth transition from day to night
                  duration: 5
                  files:
                    - url: https://example.com/day-scene.jpg
                    - url: https://example.com/night-scene.jpg
              kling-v3-standard:
                summary: "Kling V3 Standard \u2014 budget text-to-video"
                value:
                  model: kling-v3-standard
                  prompt: a paper airplane floating through a sunlit classroom
                  duration: 8
                  aspect_ratio: "16:9"
              seedance-2-text-to-video:
                summary: "Seedance 2 \u2014 text-to-video"
                value:
                  model: seedance-2-preview
                  prompt: a golden retriever running through autumn leaves in slow motion
                  duration: 5
                  aspect_ratio: "16:9"
              seedance-2-image-to-video:
                summary: "Seedance 2 \u2014 image-to-video"
                value:
                  model: seedance-2-preview
                  prompt: "@image1 the woman turns to face the camera and smiles"
                  duration: 5
                  files:
                    - url: https://example.com/portrait.jpg
              seedance-2-fast:
                summary: "Seedance 2 Fast \u2014 quick iteration"
                value:
                  model: seedance-2-fast-preview
                  prompt: aerial drone shot over a tropical island with turquoise water
                  duration: 10
                  aspect_ratio: "16:9"
              sora-2-text-to-video:
                summary: "Sora 2 \u2014 text-to-video"
                value:
                  model: sora-2
                  prompt: a chef preparing sushi in a high-end restaurant, cinematic lighting
                  duration: 5
                  aspect_ratio: "16:9"
              sora-2-image-to-video:
                summary: "Sora 2 \u2014 image-to-video"
                value:
                  model: sora-2
                  prompt: the scene slowly comes to life with gentle wind and moving clouds
                  duration: 5
                  files:
                    - url: https://example.com/landscape.jpg
              sora-2-remix:
                summary: "Sora 2 Remix \u2014 video-to-video"
                value:
                  model: sora-2-remix
                  prompt: transform into an anime art style with vibrant colors
                  files:
                    - url: https://example.com/original.mp4
              wan-25:
                summary: "Wan 2.5 \u2014 text-to-video"
                value:
                  model: wan-2.5
                  prompt: a dancer performing contemporary dance in an empty warehouse, dramatic shadows
                  duration: 5
                  aspect_ratio: "9:16"
              minimax:
                summary: "MiniMax \u2014 text-to-video"
                value:
                  model: minimax
                  prompt: a cat sitting on a windowsill watching rain fall outside
                  duration: 5
                  aspect_ratio: "16:9"
              ltx:
                summary: "LTX \u2014 fast text-to-video"
                value:
                  model: ltx-2-19b-distilled
                  prompt: abstract colorful particles flowing through space
                  duration: 5
                  aspect_ratio: "16:9"
              grok-imagine-video:
                summary: "Grok Imagine \u2014 text-to-video"
                value:
                  model: grok-imagine
                  prompt: a steam train crossing a stone bridge over a misty valley
                  duration: 5
                  aspect_ratio: "16:9"
              grok-imagine-edit:
                summary: "Grok Imagine Edit \u2014 video editing"
                value:
                  model: grok-imagine-edit
                  prompt: change the background to a tropical beach at sunset
                  files:
                    - url: https://example.com/original.mp4
              lipsync-veed:
                summary: "VEED Fabric 1.0 \u2014 lipsync"
                value:
                  model: veed-fabric-1.0
                  prompt: ""
                  files:
                    - url: https://example.com/talking-head.mp4
                    - url: https://example.com/narration.mp3
              lipsync-sync:
                summary: "Sync V2 \u2014 lipsync"
                value:
                  model: sync-v2
                  prompt: ""
                  files:
                    - url: https://example.com/talking-head.mp4
                    - url: https://example.com/narration.mp3
              lipsync-omnihuman:
                summary: "OmniHuman 1.5 \u2014 lipsync"
                value:
                  model: omnihuman-v1.5
                  prompt: ""
                  files:
                    - url: https://example.com/portrait.jpg
                    - url: https://example.com/speech.mp3
              upscale-seedvr-video:
                summary: "SeedVR \u2014 video upscale"
                value:
                  model: seedvr-video
                  prompt: ""
                  files:
                    - url: https://example.com/low-res-video.mp4
              upscale-topaz-video:
                summary: "Topaz \u2014 video upscale"
                value:
                  model: topaz-video
                  prompt: ""
                  files:
                    - url: https://example.com/low-res-video.mp4
      responses:
        "202":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"

  /image:
    post:
      operationId: createImage
      tags: [Generation]
      summary: Generate image
      description: |
        Generate an image from a text prompt, or edit/upscale an existing image. Returns a job that you poll or stream for completion.

        This endpoint also handles **image editing** (provide a source image via `files`) and **image upscaling** (provide an image with an upscale model).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model:
                  type: string
                  description: |
                    Image model to use. Also accepts image editing and upscale models.

                    **Text-to-image:** `flux-pro`, `flux-dev`, `flux-schnell`, `nano-banana-pro`, `recraft-v3`, `phota`, `grok-imagine-image`, `soul`

                    **Image editing:** `nano-banana-pro/edit`, `nano-banana-2/edit`, `phota/edit`, `phota/enhance`, `grok-imagine-image/edit`, `seedream-v4.5/edit`, `qwen-angles`

                    **Image upscale:** `seedvr`, `recraft-clarity`, `clarity-upscaler`, `topaz`, `ccsr`, `aura-sr`
                  examples:
                    - flux-pro
                    - flux-schnell
                    - nano-banana-pro
                    - recraft-v3
                    - phota
                    - grok-imagine-image
                    - soul
                    - nano-banana-pro/edit
                    - seedvr
                    - topaz
                prompt:
                  type: string
                  description: Text description of the image to generate. For editing models, describe the desired change. For upscale models, can be empty.
                  example: sunset over mountains, dramatic lighting, photorealistic
                aspect_ratio:
                  type: string
                  description: Output aspect ratio
                  default: "1:1"
                  examples:
                    - "1:1"
                    - "16:9"
                    - "9:16"
                    - "4:3"
                    - "3:4"
                files:
                  type: array
                  description: |
                    Input images for editing, style transfer, or upscaling.

                    - **Image editing:** 1 source image URL
                    - **Image upscale:** 1 image URL
                    - **Multi-angle (qwen-angles):** 1 source image
                  items:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
                        description: URL of the input image
                provider_options:
                  type: object
                  description: Additional options passed directly to the provider
                  additionalProperties: true
            examples:
              flux-pro:
                summary: "Flux Pro \u2014 text-to-image"
                value:
                  model: flux-pro
                  prompt: a minimalist logo design, geometric shapes, blue and white gradient
                  aspect_ratio: "1:1"
              flux-schnell:
                summary: "Flux Schnell \u2014 fast text-to-image"
                value:
                  model: flux-schnell
                  prompt: sunset over mountains, dramatic lighting, photorealistic
                  aspect_ratio: "16:9"
              nano-banana-pro:
                summary: "Nano Banana Pro \u2014 photorealistic"
                value:
                  model: nano-banana-pro
                  prompt: professional headshot of a woman in a modern office, natural lighting, shallow depth of field
                  aspect_ratio: "1:1"
              nano-banana-edit:
                summary: "Nano Banana Pro \u2014 image editing"
                value:
                  model: nano-banana-pro/edit
                  prompt: change the shirt color to bright red
                  files:
                    - url: https://example.com/portrait.jpg
              recraft-v3:
                summary: "Recraft V3 \u2014 design and illustration"
                value:
                  model: recraft-v3
                  prompt: flat vector illustration of a coffee shop storefront, warm colors, clean lines
                  aspect_ratio: "1:1"
              phota:
                summary: "Phota \u2014 text-to-image"
                value:
                  model: phota
                  prompt: product photo of a ceramic mug on a wooden table, morning light, steam rising
                  aspect_ratio: "4:3"
              phota-edit:
                summary: "Phota Edit \u2014 image editing"
                value:
                  model: phota/edit
                  prompt: remove the background and replace with a clean white studio
                  files:
                    - url: https://example.com/product.jpg
              grok-imagine-image:
                summary: "Grok Imagine \u2014 text-to-image"
                value:
                  model: grok-imagine-image
                  prompt: a medieval castle perched on a cliff overlooking a stormy sea
                  aspect_ratio: "16:9"
              qwen-angles:
                summary: "Qwen Angles \u2014 multi-angle views"
                value:
                  model: qwen-angles
                  prompt: generate multiple angles of this product
                  files:
                    - url: https://example.com/product.jpg
              soul:
                summary: "Soul \u2014 text-to-image (Higgsfield)"
                value:
                  model: soul
                  prompt: a cyberpunk street scene at night, neon reflections on wet pavement
                  aspect_ratio: "16:9"
              upscale-seedvr:
                summary: "SeedVR \u2014 image upscale"
                value:
                  model: seedvr
                  prompt: ""
                  files:
                    - url: https://example.com/low-res-photo.jpg
              upscale-topaz:
                summary: "Topaz \u2014 image upscale"
                value:
                  model: topaz
                  prompt: ""
                  files:
                    - url: https://example.com/low-res-photo.jpg
      responses:
        "202":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"

  /speech:
    post:
      operationId: createSpeech
      tags: [Generation]
      summary: Generate speech
      description: |
        Convert text to speech using ElevenLabs voices. Returns a job that you poll or stream for completion.

        Use `GET /voices` to browse all available voices with previews.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, text]
              properties:
                model:
                  type: string
                  description: |
                    Speech model to use.

                    **Latest:** `eleven_v3` (best quality, multilingual)

                    **Fast:** `eleven_flash_v2_5`, `eleven_flash_v2` (lowest latency)

                    **Turbo:** `eleven_turbo_v2_5`, `eleven_turbo_v2`, `turbo` (balanced)

                    **Multilingual:** `eleven_multilingual_v2` (29 languages)
                  examples:
                    - eleven_v3
                    - eleven_flash_v2_5
                    - eleven_multilingual_v2
                    - eleven_turbo_v2_5
                    - turbo
                text:
                  type: string
                  description: Text to convert to speech
                  example: Hello everyone! Welcome to my channel.
                voice:
                  type: string
                  description: Voice name or ElevenLabs voice_id. Use `GET /voices` to browse available voices.
                  default: rachel
                  enum:
                    - rachel
                    - domi
                    - sarah
                    - antoni
                    - elli
                    - josh
                    - arnold
                    - adam
                    - sam
                provider_options:
                  type: object
                  description: Additional options passed directly to the provider (e.g. stability, similarity_boost, style)
                  additionalProperties: true
            examples:
              eleven-v3:
                summary: "ElevenLabs V3 \u2014 best quality"
                value:
                  model: eleven_v3
                  text: "Welcome to today's episode. We'll be exploring the fascinating world of deep sea creatures."
                  voice: rachel
              eleven-multilingual:
                summary: "ElevenLabs Multilingual \u2014 29 languages"
                value:
                  model: eleven_multilingual_v2
                  text: "Bonjour tout le monde! Bienvenue sur ma cha\u00eene."
                  voice: sarah
              eleven-flash:
                summary: "ElevenLabs Flash \u2014 low latency"
                value:
                  model: eleven_flash_v2_5
                  text: "Breaking news: scientists have discovered a new species of deep-sea fish."
                  voice: josh
              turbo:
                summary: "Turbo \u2014 balanced speed and quality"
                value:
                  model: turbo
                  text: "Hey there! Just wanted to share a quick update on the project."
                  voice: adam
      responses:
        "202":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"

  /music:
    post:
      operationId: createMusic
      tags: [Generation]
      summary: Generate music
      description: |
        Generate background music from a text description using ElevenLabs. Returns a job that you poll or stream for completion.

        Describe genre, mood, tempo, and instruments for best results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model:
                  type: string
                  description: Music model to use. Currently `music_v1` is the only available model.
                  example: music_v1
                prompt:
                  type: string
                  description: Description of the music to generate. Include genre, mood, tempo, and instruments.
                  example: upbeat electronic pop, energetic, 120bpm
                duration:
                  type: number
                  description: Duration in seconds
                  example: 30
                provider_options:
                  type: object
                  description: Additional options passed directly to the provider
                  additionalProperties: true
            examples:
              cinematic:
                summary: "Music V1 \u2014 cinematic score"
                value:
                  model: music_v1
                  prompt: epic cinematic orchestral score, building tension, dramatic strings, brass crescendo
                  duration: 30
              electronic:
                summary: "Music V1 \u2014 electronic pop"
                value:
                  model: music_v1
                  prompt: upbeat electronic pop, energetic, 120bpm, synth arpeggios
                  duration: 15
              ambient:
                summary: "Music V1 \u2014 ambient background"
                value:
                  model: music_v1
                  prompt: calm ambient lo-fi, soft piano, gentle rain sounds, relaxing study music
                  duration: 60
      responses:
        "202":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"

  /transcription:
    post:
      operationId: createTranscription
      tags: [Generation]
      summary: Transcribe audio
      description: |
        Transcribe audio to text using Whisper. Returns a job that you poll or stream for completion.

        Supports both Fal-hosted Whisper and Groq-hosted Whisper (faster, cheaper).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, audio_url]
              properties:
                model:
                  type: string
                  description: |
                    Transcription model to use.

                    **Fal (standard):** `whisper`, `whisper-large-v3`

                    **Groq (faster, cheaper):** `groq-whisper`, `groq-whisper-large-v3`, `groq-whisper-large-v3-turbo`
                  examples:
                    - whisper
                    - whisper-large-v3
                    - groq-whisper
                    - groq-whisper-large-v3-turbo
                audio_url:
                  type: string
                  format: uri
                  description: URL of the audio file to transcribe (mp3, wav, m4a, webm, etc.)
                  example: https://example.com/audio.mp3
                language:
                  type: string
                  description: Language code (e.g. "en", "es", "fr", "ja"). Auto-detected if omitted.
                  example: en
                provider_options:
                  type: object
                  description: Additional options passed directly to the provider
                  additionalProperties: true
            examples:
              whisper:
                summary: "Whisper \u2014 standard transcription"
                value:
                  model: whisper
                  audio_url: https://example.com/podcast-episode.mp3
              whisper-large:
                summary: "Whisper Large V3 \u2014 highest accuracy"
                value:
                  model: whisper-large-v3
                  audio_url: https://example.com/interview.wav
                  language: en
              groq-whisper:
                summary: "Groq Whisper \u2014 fast and cheap"
                value:
                  model: groq-whisper
                  audio_url: https://example.com/meeting-recording.mp3
              groq-whisper-turbo:
                summary: "Groq Whisper Turbo \u2014 fastest"
                value:
                  model: groq-whisper-large-v3-turbo
                  audio_url: https://example.com/voice-memo.m4a
                  language: en
      responses:
        "202":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"

  /ffmpeg/probe:
    post:
      operationId: probeMedia
      tags: [Media Processing]
      summary: Probe media file
      description: |
        Inspect a video or audio file to retrieve metadata: duration, dimensions, codec, fps, bitrate, and file size. Returns results synchronously.

        Use this before trim or resize to understand the media you're working with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: URL of the video or audio file to inspect
                  example: https://s3.varg.ai/o/my-video.mp4
            examples:
              probe-video:
                summary: "Probe a video file"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
      responses:
        "200":
          description: Media metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "500":
          $ref: "#/components/responses/InternalError"

  /ffmpeg/trim:
    post:
      operationId: trimVideo
      tags: [Media Processing]
      summary: Trim video
      description: |
        Cut a segment from a video by specifying start time and either end time or duration. Returns a job that you poll for completion.

        Set `precise: true` for frame-accurate cuts (re-encodes, slower). Default is fast keyframe-aligned cutting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, start]
              properties:
                url:
                  type: string
                  format: uri
                  description: URL of the source video
                  example: https://s3.varg.ai/o/my-video.mp4
                start:
                  type: number
                  minimum: 0
                  description: Start time in seconds
                  example: 5
                end:
                  type: number
                  minimum: 0
                  description: End time in seconds (mutually exclusive with `duration`)
                  example: 15
                duration:
                  type: number
                  minimum: 0
                  description: Duration in seconds (mutually exclusive with `end`)
                precise:
                  type: boolean
                  default: false
                  description: Frame-accurate cuts (re-encodes) vs fast keyframe-aligned
            examples:
              trim-with-end:
                summary: "Trim 5s to 15s"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  start: 5
                  end: 15
              trim-with-duration:
                summary: "Trim 10s starting at 5s"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  start: 5
                  duration: 10
              trim-precise:
                summary: "Frame-accurate trim"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  start: 2.5
                  end: 8.3
                  precise: true
      responses:
        "202":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /ffmpeg/resize:
    post:
      operationId: resizeVideo
      tags: [Media Processing]
      summary: Resize video
      description: |
        Scale a video to new dimensions. At least one of `width` or `height` must be provided; the other is calculated to maintain aspect ratio.

        Three fit modes:
        - `cover` (default) — fill the target size, cropping overflow
        - `contain` — fit within the target size, adding black bars if needed
        - `stretch` — distort to exact dimensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: URL of the source video
                  example: https://s3.varg.ai/o/my-video.mp4
                width:
                  type: integer
                  minimum: 1
                  description: Target width in pixels
                  example: 1080
                height:
                  type: integer
                  minimum: 1
                  description: Target height in pixels
                  example: 1920
                fit:
                  type: string
                  enum: [contain, cover, stretch]
                  default: cover
                  description: How to fit the video into the target dimensions
            examples:
              resize-portrait:
                summary: "Resize to 1080x1920 (portrait)"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  width: 1080
                  height: 1920
              resize-width-only:
                summary: "Resize to 720p width (auto height)"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  width: 1280
              resize-contain:
                summary: "Letterbox to 1080x1080"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  width: 1080
                  height: 1080
                  fit: contain
      responses:
        "202":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /ffmpeg/slice:
    post:
      operationId: sliceVideo
      tags: [Media Processing]
      summary: Slice video into segments
      description: |
        Split a video into time-based segments. Each segment includes a video file, a full-resolution first frame (JPEG), and a 480px thumbnail (WebP).

        Exactly one of `every`, `at`, `count`, or `ranges` must be provided.

        - `every` — split at regular intervals (e.g. every 15 seconds)
        - `at` — split at specific timestamps
        - `count` — split into N equal parts
        - `ranges` — split at explicit time ranges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [video_url]
              properties:
                video_url:
                  type: string
                  format: uri
                  description: URL of the source video
                  example: https://s3.varg.ai/o/my-video.mp4
                codec:
                  type: string
                  enum: [copy, reencode]
                  default: copy
                  description: "`copy` for fast keyframe-aligned cuts, `reencode` for frame-accurate"
                every:
                  type: number
                  minimum: 0.1
                  maximum: 3600
                  description: Split every N seconds
                  example: 15
                at:
                  type: array
                  items:
                    type: number
                    minimum: 0
                  description: Split at specific timestamps (seconds)
                  example: [5, 15, 30]
                count:
                  type: integer
                  minimum: 2
                  maximum: 1000
                  description: Split into N equal parts
                  example: 4
                ranges:
                  type: array
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: number
                        minimum: 0
                      end:
                        type: number
                        minimum: 0
                  description: Explicit time ranges to extract
                thumbnails:
                  type: boolean
                  default: true
                  description: Extract first_frame (full-res JPEG) and thumbnail (480px WebP) for each segment
            examples:
              every-15s:
                summary: "Split every 15 seconds"
                value:
                  video_url: https://s3.varg.ai/o/my-video.mp4
                  every: 15
              count-4:
                summary: "Split into 4 equal parts"
                value:
                  video_url: https://s3.varg.ai/o/my-video.mp4
                  count: 4
              at-timestamps:
                summary: "Split at specific timestamps"
                value:
                  video_url: https://s3.varg.ai/o/my-video.mp4
                  at: [5, 15, 30]
              no-thumbnails:
                summary: "Split without thumbnails"
                value:
                  video_url: https://s3.varg.ai/o/my-video.mp4
                  every: 10
                  thumbnails: false
      responses:
        "202":
          description: Job created. Poll with `GET /jobs/{job_id}`. Completed job metadata contains `segments` array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
              example:
                job_id: job_abc123
                status: queued
                cache:
                  hit: false
                pricing:
                  estimated: 5
                  billing: metered
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /ffmpeg:
    post:
      operationId: runFfmpeg
      tags: [Media Processing]
      summary: Run FFmpeg command
      description: |
        Run an arbitrary FFmpeg command in the cloud. Use `{{in_1}}`, `{{in_2}}` as input file placeholders and `{{out_1}}` as the output placeholder.

        For single-input convenience, pass `url` and your command will be automatically wrapped: `-i {{in_1}} <your command> {{out_1}}`.

        For multi-input workflows (concat, overlay, etc.), use `input_files` to map labels to URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                url:
                  type: string
                  format: uri
                  description: Primary input file URL (shorthand — becomes `{{in_1}}`). Mutually exclusive with providing `in_1` in `input_files`.
                  example: https://s3.varg.ai/o/my-video.mp4
                command:
                  type: string
                  description: FFmpeg command arguments. Use `{{in_1}}`, `{{out_1}}` placeholders.
                  example: "-vf eq=brightness=0.1 -c:a copy"
                input_files:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of input labels to URLs (e.g. `{"in_1": "url1", "in_2": "url2"}`)
                output_files:
                  oneOf:
                    - type: object
                      additionalProperties:
                        type: string
                    - type: string
                      enum: ["OUTPUT_FOLDER"]
                  description: Output file map or `"OUTPUT_FOLDER"`. Defaults to `{"out_1": "output.mp4"}`.
                  default:
                    out_1: output.mp4
            examples:
              brightness:
                summary: "Adjust brightness"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  command: "-vf eq=brightness=0.1 -c:a copy"
              extract-audio:
                summary: "Extract audio to MP3"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  command: "-vn -acodec libmp3lame"
                  output_files:
                    out_1: audio.mp3
              speed-up:
                summary: "2x speed"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  command: "-filter:v setpts=0.5*PTS -filter:a atempo=2.0"
              to-gif:
                summary: "Convert to GIF"
                value:
                  url: https://s3.varg.ai/o/my-video.mp4
                  command: "-vf fps=10,scale=480:-1:flags=lanczos -loop 0"
                  output_files:
                    out_1: output.gif
      responses:
        "202":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"
        "402":
          $ref: "#/components/responses/InsufficientBalanceError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /jobs/{job_id}:
    get:
      operationId: getJob
      tags: [Jobs]
      summary: Get job status
      description: Retrieve the current status and output of a generation job.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: The job ID returned when the job was created
          example: job_a1b2c3d4
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: cancelJob
      tags: [Jobs]
      summary: Cancel job
      description: Cancel a queued or processing job. Has no effect on completed or failed jobs.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: The job ID to cancel
          example: job_a1b2c3d4
      responses:
        "204":
          description: Job cancelled
        "401":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /jobs/{job_id}/stream:
    get:
      operationId: streamJob
      tags: [Jobs]
      summary: Stream job updates
      description: |
        Real-time job status updates via Server-Sent Events (SSE).

        Events have type `status` and contain the full job object as JSON data. The stream closes automatically when the job reaches a terminal state (completed, failed, cancelled).

        Keepalive comments are sent every 15 seconds. The connection times out after 10 minutes.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: The job ID to stream
          example: job_a1b2c3d4
      responses:
        "200":
          description: SSE stream of job status events
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                status-event:
                  summary: Status update event
                  value: |
                    event: status
                    data: {"job_id":"job_a1b2c3d4","status":"processing","model":"fal:kling-v2.5","created_at":"2026-02-13T10:00:00Z"}

                    event: status
                    data: {"job_id":"job_a1b2c3d4","status":"completed","model":"fal:kling-v2.5","output":{"url":"https://s3.varg.ai/o/job_a1b2c3d4.mp4","media_type":"video/mp4"},"created_at":"2026-02-13T10:00:00Z","completed_at":"2026-02-13T10:02:30Z"}
        "401":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /files:
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload file
      description: |
        Upload a file (image, audio, video) for use in generation requests. Returns a stable URL you can pass to `files[].url`.

        Max file size: 50MB. Pass `X-Content-Hash` for deduplication — if a file with the same hash already exists, the existing file is returned without re-uploading.
      parameters:
        - name: X-Content-Hash
          in: header
          required: false
          schema:
            type: string
          description: SHA-256 hash of the file content, used for deduplication
          example: sha256:abc123def456...
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "413":
          description: File too large (max 50MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /voices:
    get:
      operationId: listVoices
      tags: [Reference]
      summary: List voices
      description: Returns all available voices for speech generation.
      responses:
        "200":
          description: List of voices
          content:
            application/json:
              schema:
                type: object
                properties:
                  voices:
                    type: array
                    items:
                      type: object
                      properties:
                        voice_id:
                          type: string
                          example: rachel
                        name:
                          type: string
                          example: Rachel
              example:
                voices:
                  - voice_id: rachel
                    name: Rachel
                  - voice_id: domi
                    name: Domi
                  - voice_id: sarah
                    name: Sarah
                  - voice_id: antoni
                    name: Antoni
                  - voice_id: elli
                    name: Elli
                  - voice_id: josh
                    name: Josh
                  - voice_id: arnold
                    name: Arnold
                  - voice_id: adam
                    name: Adam
                  - voice_id: sam
                    name: Sam
        "401":
          $ref: "#/components/responses/AuthError"

  /balance:
    get:
      operationId: getBalance
      tags: [Account]
      summary: Get balance
      description: Returns your current account balance in cents.
      responses:
        "200":
          description: Account balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance_cents:
                    type: number
                    description: Current balance in cents
                    example: 5000
                  currency:
                    type: string
                    example: usd
              example:
                balance_cents: 5000
                currency: usd
        "401":
          $ref: "#/components/responses/AuthError"

  /usage:
    get:
      operationId: getUsage
      tags: [Account]
      summary: Get usage
      description: Returns usage records for the specified date range.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start date (inclusive), e.g. 2026-01-01
          example: "2026-01-01"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date (inclusive), e.g. 2026-01-31
          example: "2026-01-31"
      responses:
        "200":
          description: Usage records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "401":
          $ref: "#/components/responses/AuthError"

  /me:
    get:
      operationId: getMe
      tags: [Account]
      summary: Get current user
      description: Returns the authenticated user's profile.
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    example: user_abc123
                  email:
                    type: string
                    format: email
                    example: user@example.com
              example:
                userId: user_abc123
                email: user@example.com
        "401":
          $ref: "#/components/responses/AuthError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: varg_xxx
      description: |
        API key from [varg.ai/dashboard](https://varg.ai/dashboard).

        Pass as `Authorization: Bearer varg_xxx`.

  schemas:
    JobResponse:
      type: object
      required: [job_id, status, model, created_at]
      properties:
        job_id:
          type: string
          description: Unique job identifier
          example: job_a1b2c3d4
        status:
          type: string
          enum: [queued, processing, completed, failed, cancelled]
          description: Current job status
          example: completed
        model:
          type: string
          description: Resolved model identifier (provider:model format)
          example: fal:kling-v2.5
        created_at:
          type: string
          format: date-time
          description: When the job was created
          example: "2026-02-13T10:00:00Z"
        completed_at:
          type: string
          format: date-time
          description: When the job finished (completed, failed, or cancelled)
          example: "2026-02-13T10:02:30Z"
        output:
          type: object
          description: Job output, present when status is completed
          properties:
            url:
              type: string
              format: uri
              description: URL of the generated file on s3.varg.ai
              example: https://s3.varg.ai/o/job_a1b2c3d4.mp4
            media_type:
              type: string
              description: MIME type of the output
              example: video/mp4
        cache:
          type: object
          description: Cache metadata
          properties:
            hit:
              type: boolean
              description: Whether this result was served from cache
              example: false
            key:
              type: string
              description: Cache key for this request
              example: "sha256:abc123..."
        error:
          type: string
          description: Error message, present when status is failed
          example: Provider returned an error

    ProbeResponse:
      type: object
      properties:
        duration:
          type: number
          description: Duration in seconds
          example: 12.5
        width:
          type: integer
          description: Video width in pixels
          example: 1920
        height:
          type: integer
          description: Video height in pixels
          example: 1080
        codec:
          type: string
          description: Video codec
          example: h264
        audio_codec:
          type: string
          description: Audio codec
          example: aac
        format:
          type: string
          description: Container format
          example: mov,mp4,m4a,3gp,3g2,mj2
        bitrate:
          type: number
          description: Overall bitrate in bits/second
          example: 5200000
        fps:
          type: number
          description: Frames per second
          example: 30
        size_bytes:
          type: number
          description: File size in bytes
          example: 8125000

    FileUploadResponse:
      type: object
      required: [file_id, url, hash, size, media_type, deduplicated]
      properties:
        file_id:
          type: string
          description: Unique file identifier
          example: file_abc123
        url:
          type: string
          format: uri
          description: Stable URL for the uploaded file
          example: https://s3.varg.ai/u/user_xxx/abc123.jpg
        hash:
          type: string
          description: SHA-256 hash of the file content
          example: sha256:abc123def456...
        size:
          type: number
          description: File size in bytes
          example: 102400
        media_type:
          type: string
          description: Detected MIME type
          example: image/jpeg
        deduplicated:
          type: boolean
          description: True if an existing file with the same hash was returned
          example: false

    UsageResponse:
      type: object
      properties:
        usage:
          type: array
          items:
            $ref: "#/components/schemas/UsageRecord"
        total_cents:
          type: number
          description: Total cost in cents for the period
          example: 1250

    UsageRecord:
      type: object
      properties:
        job_id:
          type: string
          example: job_a1b2c3d4
        model:
          type: string
          example: fal:kling-v2.5
        capability:
          type: string
          enum: [video, image, speech, music, transcription]
          example: video
        cost_cents:
          type: number
          description: Cost in cents
          example: 25
        cache_hit:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: "2026-02-13T10:00:00Z"

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Error code
          example: ValidationError
        message:
          type: string
          description: Human-readable error description
          example: prompt is required
        field:
          type: string
          description: The field that caused the error, if applicable
          example: prompt
        provider:
          type: string
          description: The upstream provider that returned the error, if applicable
          example: fal
        statusCode:
          type: number
          description: HTTP status code
          example: 400

  responses:
    ValidationError:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: ValidationError
            message: prompt is required
            field: prompt
            statusCode: 400

    AuthError:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: AuthError
            message: Invalid API key
            statusCode: 401

    InsufficientBalanceError:
      description: Account balance too low
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: InsufficientBalanceError
            message: Insufficient balance. Add credits at varg.ai/dashboard.
            statusCode: 402

    NotFoundError:
      description: Job or file not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: NotFoundError
            message: Job not found
            statusCode: 404

    RateLimitError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: RateLimitError
            message: Rate limit exceeded. Retry after 60 seconds.
            statusCode: 429

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: InternalError
            message: An unexpected error occurred
            statusCode: 500

    ProviderError:
      description: Upstream provider returned an error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: ProviderError
            message: Provider returned an error
            provider: fal
            statusCode: 502

  headers:
    X-Cache:
      description: Whether the response was served from cache (HIT or MISS)
      schema:
        type: string
        enum: [HIT, MISS]
    X-Cache-Key:
      description: The cache key for this request
      schema:
        type: string
    X-Cache-TTL:
      description: Cache TTL in seconds
      schema:
        type: number
